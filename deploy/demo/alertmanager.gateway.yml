route:
  receiver: anomalyguard
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 30m

receivers:
  - name: anomalyguard
    webhook_configs:
      - url: http://ag2-backend:8000/webhooks/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: REPLACE_WITH_TOKEN
